<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:"
  />
  <title>AEGIS Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>AEGIS <span class="accent">Desktop</span></h1>
    <div class="conn">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">connecting…</span>
    </div>
    <!-- The rolling session token total, counted the way the CLI counts it:
         every finished turn folded into one running number rather than a
         per-turn count that resets. Hidden until a turn has been accounted
         for, so an untouched thread never shows a `0 tok` it never measured. -->
    <div class="session-meter" id="session-meter" hidden></div>
    <div class="spacer"></div>
    <button type="button" id="new-chat" class="ghost-btn">New chat</button>
  </header>

  <div class="update-banner" id="update-banner" role="status" hidden>
    <span id="update-banner-text"></span>
    <div class="update-banner-actions">
      <button type="button" id="update-download-btn" class="ghost-btn" hidden>Download</button>
      <button type="button" id="update-restart-btn" class="ghost-btn" hidden>Restart to install</button>
      <button type="button" id="update-retry-btn" class="ghost-btn" hidden>Retry</button>
      <button type="button" id="update-later-btn" class="ghost-btn">Later</button>
    </div>
  </div>

  <main>
    <aside class="side">
      <section class="card">
        <h2>Status</h2>
        <dl>
          <dt>app</dt><dd id="st-app">–</dd>
          <dt>client</dt><dd id="st-client">–</dd>
          <dt>endpoint</dt><dd id="st-base">–</dd>
          <dt>key</dt><dd id="st-key">–</dd>
          <dt>plan</dt><dd id="st-plan">–</dd>
          <dt>balance</dt><dd id="st-balance">–</dd>
        </dl>
        <div class="api-key-row">
          <input
            type="password"
            id="api-key-input"
            placeholder="AEGIS API key"
            autocomplete="off"
          />
          <button type="button" id="api-key-save" class="ghost-btn">Save</button>
          <button type="button" id="api-key-verify" class="ghost-btn">Verify</button>
        </div>
        <p class="hint" id="api-key-hint"></p>
        <!-- Billing actions (upgrade / top-up). Both hit aegis1 — POST
             /api/billing/checkout (subscription, STRIPE_MEMORY_PRICE_ID) and
             POST /api/token-bank/topup (amount_eur, server range 2–1000) —
             and both answer a Stripe URL that is opened in the OS browser via
             the same openExternal IPC the cap notices use. One row, no modal:
             the status line below carries every outcome. -->
        <div class="billing-row">
          <button type="button" id="upgrade-plan" class="ghost-btn">Upgrade plan</button>
          <span class="billing-topup">
            <button type="button" id="topup-btn" class="ghost-btn">Top up</button>
            <select id="topup-amount" title="Top-up amount (EUR)">
              <option value="5">€5</option>
              <option value="10" selected>€10</option>
              <option value="25">€25</option>
              <option value="50">€50</option>
            </select>
          </span>
        </div>
        <p class="hint" id="billing-hint"></p>
      </section>

      <section class="card">
        <h2>Model</h2>
        <label for="class-select">Provider class</label>
        <select id="class-select"></select>

        <label for="model-select">Model</label>
        <select id="model-select"></select>
        <select id="model-preset" hidden title="Quick-fill a known model + base URL"></select>
        <input
          type="text"
          id="model-input"
          placeholder="type a model id — e.g. gpt-4o-mini"
          autocomplete="off"
          hidden
        />

        <!-- The one budget control, for every class and every model.

             It replaced a "Max tokens" dropdown (1k/4k/16k/64k/300k plus an
             "adaptive" checkbox) that asked the user to state, up front, how
             many tokens an answer would need. That cannot be known from the
             prompt — it is a guess at the length of text nobody has written
             yet — and the guess was wrong in both directions:

               - the pooled AEGIS Cloud class sizes each call server-side from
                 effort (aegis1 services/pool_brain.py pass_budgets:
                 low/medium/high -> 16384/32768/65536 tokens total across the
                 worker fan-out), and it reads a body max_tokens as a ceiling
                 OVER that ladder, so the number on screen was never the
                 budget the call ran on;
               - a DeepSeek reasoning model (deepseek-flash, i.e. "Flash 4.1")
                 bills hidden chain-of-thought against the same budget as its
                 answer, so the dropdown's 4k default was spent before the
                 first visible token and the turn came back empty — no error,
                 no tool call, just a turn that "completed" with nothing.

             So the budget is derived from this rung instead. The engine maps
             low/medium/high to 8192/16384/32768 (EFFORT_TOKEN_BUDGET in
             desktop/lib/local/engine.js, mirroring aegiscodex-dev's
             src/backend.js), "auto" leaves the choice to the server, and no
             max_tokens is stated by this app at all. The row is always on
             screen: with the dropdown gone there is nothing to swap it for. -->
        <div class="budget-row" id="effort-row">
          <label for="effort-select" title="Sizes the call's token budget. Output length cannot be predicted from the prompt, so the budget comes from this rung instead of a stated number.">Effort</label>
          <select id="effort-select">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="auto" selected>auto</option>
          </select>
        </div>

        <!-- What the rung above means for the model selected right now, in
             tokens. Written only by updateBudgetControls (app.js), so it cannot
             disagree with the request that follows it. -->
        <p class="hint budget-hint" id="budget-hint"></p>

        <label
          class="flow-toggle"
          for="autonomous-toggle"
          id="autonomous-toggle-wrap"
          hidden
          title="Fan THIS chat turn out to several Aegis Cloud reasoning workers and synthesize their findings into one answer. Aegis Cloud only, and off by default because it costs about (workers + 1) full model calls per turn. This is a per-turn setting for the thread; it does not govern the unattended queue below, which runs each queued task on a single pass unless that task asks for the fan-out."
        >
          <input type="checkbox" id="autonomous-toggle" />
          <span>fan out this turn</span>
        </label>
        <div id="autonomous-controls" class="autonomous-controls" hidden>
          <label for="autonomous-workers">Workers</label>
          <input
            type="number"
            id="autonomous-workers"
            min="1"
            max="8"
            step="1"
            title="How many reasoning workers this turn fans out to. Every worker is a separate full model call on the same tier, so the turn costs roughly this number plus one times a normal one — higher is not automatically better."
          />
        </div>
        <p class="hint" id="model-hint"></p>
      </section>

      <section class="card">
        <h2>Provider settings</h2>
        <div id="settings-list"></div>
        <p class="hint" id="settings-hint"></p>
      </section>

      <section class="card">
        <h2>Quick Launcher</h2>
        <label
          class="flow-toggle"
          for="quick-launcher-enabled"
          title="Register a systemwide keyboard shortcut that opens a small always-on-top prompt window from anywhere on the desktop, even when AEGIS Desktop isn't focused. Packaged builds always have it on; this toggle is for a dev run."
        >
          <input type="checkbox" id="quick-launcher-enabled" />
          <span>enable global shortcut</span>
        </label>
        <div class="api-key-row">
          <input
            type="text"
            id="quick-launcher-shortcut"
            placeholder="CmdOrCtrl+Shift+Space"
            autocomplete="off"
          />
          <button type="button" id="quick-launcher-save" class="ghost-btn">Save</button>
        </div>
        <p class="hint" id="quick-launcher-hint"></p>
      </section>

      <section class="card">
        <h2>Tool approvals</h2>
        <label
          class="flow-toggle"
          for="confirm-mode-toggle"
          title="When on, every exec / writeFile / editFile tool call is previewed and needs your approval (once, for the session, or denied) before it runs. Turn it off to let the agent run those tools without asking."
        >
          <input type="checkbox" id="confirm-mode-toggle" />
          <span>confirm before running tools</span>
        </label>
        <p class="hint" id="confirm-mode-hint"></p>
      </section>

      <section class="card">
        <h2>Sessions</h2>
        <button type="button" id="sessions-refresh" class="ghost-btn">Refresh</button>
        <button type="button" id="sync-now" class="ghost-btn">Sync now</button>
        <button type="button" id="sessions-export" class="ghost-btn">Export</button>
        <ul class="sessions-list" id="sessions-list"></ul>
        <p class="hint" id="sessions-hint"></p>
        <p class="hint" id="sync-status"></p>
      </section>

      <section class="card">
        <!-- The heading is the click target for the full memory inspector.
             The button lives *inside* the h2 (not the reverse) because a
             <button> may only contain phrasing content, and <h2> is not. -->
        <h2>
          <button
            type="button"
            class="card-title-btn"
            id="memory-open"
            title="Open the memory inspector — every entry with its source, tags and topics"
          >
            <span>Memory</span>
            <span class="ctb-expand" aria-hidden="true">⤢</span>
          </button>
        </h2>
        <form id="memory-search-form" class="memory-search">
          <input
            type="text"
            id="memory-query"
            placeholder="Search memory…"
            autocomplete="off"
          />
          <button type="submit" id="memory-search-btn">Search</button>
        </form>
        <ul class="memory-results" id="memory-results"></ul>
        <textarea
          id="memory-entry"
          rows="2"
          placeholder="Save a note to memory…"
        ></textarea>
        <button type="button" id="memory-save-btn" class="btn-block">Save to memory</button>
        <button type="button" id="memory-import-btn" class="btn-block">
          Import from other AI tools…
        </button>
        <p class="hint" id="memory-hint"></p>
      </section>

      <section class="card">
        <!-- The local autonomous work queue (desktop/lib/local/queue.js +
             autonomous.js, exposed as window.queue). This card is the WHOLE
             gate on it: a task runs only when one of the two buttons below is
             clicked. There is no drain-at-startup and no interval anywhere in
             app.js or main.js, because a drain spends real money on a real
             model inside the folder named here.

             The list below is state, not a transcript: the worker's own output
             arrives on queue:progress and is shown as a status line and each
             task's outcome. Nothing from a drain enters the chat thread. -->
        <h2>Autonomous queue</h2>
        <textarea
          id="queue-task"
          rows="2"
          placeholder="Queue a task to run unattended…"
        ></textarea>
        <div class="api-key-row">
          <input
            type="text"
            id="queue-cwd"
            placeholder="/path/to/repo"
            autocomplete="off"
            title="The directory the task's tool loop runs in. Must already exist."
          />
          <button type="button" id="queue-enqueue" class="ghost-btn">Queue</button>
        </div>
        <label
          class="flow-toggle"
          for="queue-commit"
          title="Commit the paths this task's own tool calls wrote, once it finishes. Anything else dirty in that checkout is left alone."
        >
          <input type="checkbox" id="queue-commit" />
          <span>commit what the task changes</span>
        </label>
        <div class="api-key-row">
          <button type="button" id="queue-drain" class="ghost-btn">Run one</button>
          <button type="button" id="queue-proceed" class="ghost-btn">Drain all</button>
          <button type="button" id="queue-stop" class="ghost-btn" hidden>Stop</button>
        </div>
        <ul class="sessions-list" id="queue-list"></ul>
        <p class="hint" id="queue-hint"></p>
      </section>
    </aside>

    <section class="chat">
      <!-- Inert template: cloned into #messages by renderWelcome() so the
           welcome markup lives in exactly one place and survives the
           innerHTML clears in newChat()/openSession(). -->
      <template id="welcome-template">
        <div class="chat-welcome" id="chat-welcome">
          <div class="chat-greeting-row">
            <div class="glyph">✦</div>
            <div class="title" id="chat-greeting">Hello</div>
          </div>
          <div class="sub">
            Ask anything — or start with one of these.
          </div>
          <div class="chat-quick-actions">
            <button class="chat-quick-pill" type="button" data-quick="Write a ">
              <span class="qp-ic">✎</span>Write code
            </button>
            <button class="chat-quick-pill" type="button" data-quick="Explain how ">
              <span class="qp-ic">✦</span>Explain a concept
            </button>
            <button
              class="chat-quick-pill"
              type="button"
              data-quick="Help me debug this error:&#10;&#10;"
            >
              <span class="qp-ic">🐛</span>Debug an error
            </button>
            <button
              class="chat-quick-pill"
              type="button"
              data-quick="Compare two approaches to "
            >
              <span class="qp-ic">⇄</span>Weigh two options
            </button>
            <button
              class="chat-quick-pill"
              type="button"
              data-quick="Help me plan "
            >
              <span class="qp-ic">⊞</span>Plan a project
            </button>
          </div>
          <div class="hints">
            Enter to send · Shift+Enter for a newline · the discovery lane adds
            two extra paths to every answer
          </div>
        </div>
      </template>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea
          id="prompt"
          rows="2"
          placeholder="Message AEGIS… (Enter to send, Shift+Enter for a newline)"
        ></textarea>
        <div class="composer-side">
          <label
            class="flow-toggle"
            for="explore-toggle"
            title="Optional, off by default. After every answer, send the AI down two extra paths — an alternative angle and an unexpected discovery — shown as a horizontal discovery lane. This costs two extra model calls per turn (roughly 3× the tokens of a plain reply)."
          >
            <!-- Unchecked in the markup on purpose: the lane bills two extra
                 model calls per turn, so it is opt-in. app.js only ticks this
                 when the user has explicitly saved 'on' (aegis.explore). -->
            <input type="checkbox" id="explore-toggle" />
            <span>discovery lane</span>
          </label>
          <button type="submit" id="send">Send</button>
        </div>
      </form>
      <!-- Mode strip: the same switch as Settings → Tool approvals, hoisted
           directly under the chat bar so the current mode is readable while
           typing and one click from the other. Both controls are painted from
           renderConfirmMode() in app.js, so they cannot disagree. -->
      <div class="composer-modes">
        <button
          type="button"
          id="auto-mode-toggle"
          class="mode-chip"
          aria-pressed="false"
          title="Auto mode lets the agent run exec, writeFile and editFile without asking. Click to switch, or set it in Settings → Tool approvals."
        >
          <span class="mode-dot" aria-hidden="true">●</span>
          <span id="auto-mode-label">ask before tools</span>
        </button>
        <span class="hint" id="auto-mode-hint"></span>
      </div>
    </section>
  </main>

  <!-- Memory inspector: full-viewport translucent overlay opened from the
       sidebar Memory heading. Markup is static and populated by
       renderMemoryOverlay() — this renderer runs under CSP `script-src 'self'`,
       so inline handlers would be dropped silently. -->
  <div class="memory-overlay" id="memory-overlay" hidden>
    <div class="memory-backdrop" id="memory-backdrop"></div>
    <div
      class="memory-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memory-panel-title"
    >
      <header class="memory-panel-head">
        <h2 id="memory-panel-title">Memory</h2>
        <span class="memory-count" id="memory-count"></span>
        <div class="spacer"></div>
        <button type="button" id="memory-close" class="ghost-btn" title="Close (Esc)">
          Close
        </button>
      </header>

      <form class="memory-filters" id="memory-filters">
        <input
          type="text"
          id="memory-overlay-query"
          placeholder="Filter by text, tag, topic or source…"
          autocomplete="off"
        />
        <button type="submit">Filter</button>
        <button type="button" id="memory-filters-clear" class="ghost-btn">Clear</button>
      </form>

      <div class="memory-chips" id="memory-chips"></div>

      <div class="memory-scroll">
        <ul class="memory-list" id="memory-list"></ul>
      </div>

      <div class="memory-actions">
        <textarea
          id="memory-overlay-entry"
          rows="2"
          placeholder="Save a note to memory…"
        ></textarea>
        <button type="button" id="memory-overlay-save" class="btn-block">
          Save to memory
        </button>
      </div>
    </div>
  </div>

  <script src="budget.js"></script>
  <script src="usage.js"></script>
  <script src="stream-policy.js"></script>
  <script src="transcript-view.js"></script>
  <script src="diff.js"></script>
  <script src="diffview.js"></script>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/aegis-highlight.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
