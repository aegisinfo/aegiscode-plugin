# electron-builder config for the AEGIS Desktop thin host (plan Phase D3).
# Targets: Windows NSIS .exe + MSI, macOS .dmg, Linux AppImage.
#
# Hard boundary: the packaged app contains ONLY the thin shell + the staged
# copy of the shared transport. electron-builder cannot reach outside the app
# dir, so scripts/predist.mjs copies ../client/aegis.js -> vendor/aegis.js
# before every build (main.js falls back to that copy when packaged).

appId: org.aegisinfo.aegiscode
productName: AEGIS Desktop
copyright: "Copyright © 2026 AEGIS Code"

directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - renderer/**/*
  - lib/**/*          # local engine modules (P1 §5.5): ollama/providers/
                      # context/settings/sync — pure Node, zero runtime deps
  # The whole staged set, never a hand-kept per-file list. desktop/vendor/ is
  # gitignored and populated ONLY by scripts/predist.mjs, so this glob is
  # exactly the files that step copies and cannot drift from it. The previous
  # explicit list named two of five staged files; main.js requires
  # vendor/credentials.js with no inner fallback, so the packaged app threw
  # MODULE_NOT_FOUND at module load (and the update checker, whose vendor copy
  # was also unlisted, silently sat at `disabled`).
  # test/packaging.test.mjs fails if predist stages something this misses.
  - vendor/**/*
  - package.json

asar: true
npmRebuild: false

# Version-tagged artifact per OS, e.g. aegis-desktop-0.3.0-win-x64.exe
artifactName: aegis-desktop-${version}-${os}-${arch}.${ext}

# electron-updater feed: GitHub Releases on the repo the release workflow
# publishes to (.github/workflows/release.yml). Generates latest.yml /
# latest-mac.yml / latest-linux.yml next to the installers on every build
# (even with --publish never), which is what main.js's autoUpdater reads.
publish:
  provider: github
  owner: aegisinfo
  repo: aegiscode-plugin

mac:
  category: public.app-category.productivity
  # zip is required alongside dmg: Squirrel.Mac (electron-updater's mac
  # updater) downloads the app as a zip, not the dmg — dmg is install-only.
  target:
    - dmg
    - zip
  # Signing/notarization is intentionally absent until certificates exist; the
  # release workflow passes CSC_IDENTITY_AUTO_DISCOVERY=false so CI builds are
  # unsigned-but-buildable on mac too. Unsigned mac builds mean autoUpdater's
  # background download will typically still work, but the OS may block the
  # unsigned update from applying — surfaced to the user as a failed status,
  # never a crash (see main.js autoUpdater error handling).

win:
  # Both Windows targets: NSIS .exe (interactive install) and MSI (managed /
  # group-policy deployment). electron-builder builds the MSI with its bundled
  # WiX toolset on the windows-latest runner — no extra setup step.
  target:
    - nsis
    - msi
  # Windows Authenticode signing runs via SignPath Foundation once the grant
  # lands (see SIGNING.md) — wired into .github/workflows/release.yml.

msi:
  # Per-machine install (Program Files), unlike NSIS which defaults to
  # perMachine=false. MSI is the target for managed deployment, so the
  # machine-wide scope is the point; oneClick stays off to show the UI.
  oneClick: false
  perMachine: true

linux:
  target: AppImage
  category: Utility
  synopsis: Thin Electron host for AEGIS Cloud
  maintainer: AEGIS Code <nborneklint@gmail.com>

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
