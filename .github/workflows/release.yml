# Phase D3 — packaging + GitHub Release.
#
# On every v* tag push: build the thin Electron host for Windows (NSIS .exe +
# MSI), macOS (.dmg) and Linux (AppImage), stage the shared client into the app
# via predist, then attach all artifacts to a draft GitHub Release.
#
# Also runnable on demand (workflow_dispatch) so a packaging change can be
# smoke-tested without cutting a release tag; the release job is skipped then.
#
# Signing: Windows Authenticode via SignPath Foundation is an external grant —
# once approved, add the SignPath GitHub Action to the windows job (see
# desktop/SIGNING.md). Until then artifacts are unsigned and clearly labeled.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Force one cache location name across all three OSes (default paths
      # differ: ~/.cache/electron on Linux, ~/Library/Caches on mac,
      # %LOCALAPPDATA% on Windows) so a single actions/cache step below can
      # key all of them the same way.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache Electron/electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install electron-builder (dev-only deps)
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Stage shared client into the app (predist)
        working-directory: desktop
        run: node scripts/predist.mjs

      - name: Package
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # No signing certs yet (SignPath Foundation application pending) —
          # mac/win builds must not fail on missing identities.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegis-desktop-${{ matrix.os }}
          # Installers only — NOT the *-unpacked/ app-bundle trees or
          # builder-debug.yml/builder-effective-config.yaml that also land in
          # desktop/release/. A bare `release/*` glob was pulling those in too:
          # hundreds of extra files inflating the upload, and (since the
          # release job re-globs `artifacts/**`) they'd have landed as loose
          # assets on the draft release itself.
          path: |
            desktop/release/*.AppImage
            desktop/release/*.exe
            desktop/release/*.msi
            desktop/release/*.dmg
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: attach artifacts to GitHub Release
    needs: package
    # A manual dispatch has no tag to attach to, so it builds and uploads
    # workflow artifacts only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**
