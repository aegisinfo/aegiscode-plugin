name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- 1. Syntax: every JS file must parse ------------------------------
      - name: Node syntax check
        run: |
          set -euo pipefail
          files=$(find . \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './.git/*' -not -path '*/node_modules/*' \
            -not -path '*/desktop/release/*' || true)
          if [ -z "$files" ]; then
            echo "No JS files found"
            exit 1
          fi
          echo "$files" | while read -r f; do
            node --check "$f"
          done

      - name: Shell syntax check
        run: |
          set -euo pipefail
          bash -n install.sh

      # --- 2. JSON validity ---------------------------------------------------
      - name: JSON validity
        run: |
          set -euo pipefail
          for f in $(find . -name '*.json' -not -path './.git/*' \
                     -not -path '*/node_modules/*' -not -path '*/desktop/release/*'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "Invalid JSON: $f"; exit 1; }
          done

      # --- 3. Secret scan: reject real keys, allow placeholders --------------
      - name: Secret scan
        run: |
          set -euo pipefail
          # Real-looking provider keys and AEGIS tokens. Placeholders use
          # literal dots/ellipses (e.g. "aegis_...", "sk-...") so they pass.
          patterns=(
            'sk-ant-[A-Za-z0-9_-]{8,}'      # Anthropic
            'sk-[A-Za-z0-9]{20,}'          # OpenAI / generic
            'gsk_[A-Za-z0-9]{20,}'         # Groq
            'aegis_[A-Za-z0-9]{20,}'       # AEGIS API key (real form)
            'AIza[0-9A-Za-z_-]{20,}'       # Google
            'xox[baprs]-[A-Za-z0-9-]{10,}' # Slack
            'ghp_[A-Za-z0-9]{20,}'         # GitHub PAT
            'Bearer [A-Za-z0-9._-]{20,}'   # Bearer token literal
          )
          found=0
          for pat in "${patterns[@]}"; do
            hits=$(grep -rnE --exclude-dir=.git --exclude-dir=node_modules \
                    --exclude-dir=release "$pat" . || true)
            if [ -n "$hits" ]; then
              echo "SECRET MATCH ($pat):"
              echo "$hits"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Secret-looking values found. Rotate and remove before merge."
            exit 1
          fi
          echo "Secret scan clean."

      # --- 4. Thin-shell guard: transport allowed, brain forbidden ------------
      - name: Thin-shell guard
        run: |
          set -euo pipefail
          # RULE (plan §1/§9): no cloud routing/tier/brain logic and no server
          # logic may enter this repo. Direct transport to user-configured model
          # endpoints is explicitly PERMITTED — pure wire-format clients +
          # storage only, keys held in main. Keep this as a literal path
          # allowlist so it does not fight the feature.
          allowed=(
            'desktop/lib/local/'
            'desktop/lib/sync/'
            'desktop/lib/settings.js'
          )
          # Any file under desktop/lib/ that is NOT one of the permitted
          # transport/storage paths is a thin-shell violation.
          for f in $(git ls-files 'desktop/lib/**' 2>/dev/null || true); do
            ok=0
            for a in "${allowed[@]}"; do
              case "$f" in
                "$a"*) ok=1 ;;
              esac
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Unpermitted file under desktop/lib/: $f (transport/storage only)"
              exit 1
            fi
          done
          # These names identify ae-guix brain artifacts; none may ship in the
          # OSS wrapper, anywhere in the tree.
          banned=(
            'SaaS.js'
            'chat-engine'
            'chat-service.js'
            'lib/memory'
            'obfuscate.mjs'
          )
          for name in "${banned[@]}"; do
            if git ls-files | grep -qF "$name"; then
              echo "::error::Banned brain/IP file present: $name"
              exit 1
            fi
          done
          # main.js: the ONLY legitimate one in the tree is the thin Electron
          # shell desktop/main.js. Any other main.js (e.g. ae-guix's brain)
          # is a leak — and desktop/main.js itself must stay a shell.
          for f in $(git ls-files | grep -E '(^|/)main\.js

      # --- 5. Smoke test: boot the MCP server, validate tools/list -----------
      - name: MCP smoke test
        run: node test/smoke.mjs

      # --- 6. Desktop host smoke test: IPC surface, no Electron binary -------
      - name: Desktop shell smoke test
        run: node test/desktop-shell.mjs
 || true); do
            if [ "$f" != "desktop/main.js" ]; then
              echo "::error::Unexpected main.js outside desktop/: $f"
              exit 1
            fi
          done
          if [ -f desktop/main.js ] && grep -qE 'chat-engine|chat-service|lib/memory|SaaS|ae-guix|obfuscate' desktop/main.js; then
            echo "::error::desktop/main.js carries a brain signature — keep it a thin shell"
            exit 1
          fi
          echo "Thin-shell guard clean."

      # --- 5. Smoke test: boot the MCP server, validate tools/list -----------
      - name: MCP smoke test
        run: node test/smoke.mjs

      # --- 6. Desktop host smoke test: IPC surface, no Electron binary -------
      - name: Desktop shell smoke test
        run: node test/desktop-shell.mjs
